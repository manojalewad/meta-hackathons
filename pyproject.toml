[project]
name = "startup-business-simulator"
version = "1.0.0"
description = "OpenEnv startup business simulator"
requires-python = ">=3.11"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "requests"
]
[project.scripts]
server = "server.app:main"
[tool.openenv]
entrypoint = "server.app:main"